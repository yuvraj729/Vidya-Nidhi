<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Vidya Nidhi Scholarship Portal | Scholarships for Students in India
    </title>

    <meta
      name="description"
      content="Find scholarships for students in India with Vidya Nidhi. Check eligibility, scholarship amounts, application details and apply online."
    />

    <meta
      name="author"
      content="Vidya Nidhi Scholarship Portal"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://vidhyanidhi.in/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0b1f3a"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Vidya Nidhi Scholarship Portal | Scholarships for Students in India"
    />

    <meta
      property="og:description"
      content="Find scholarships for students in India. Check eligibility, award amounts and application details, then apply online."
    />

    <meta
      property="og:url"
      content="https://vidhyanidhi.in/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Vidya Nidhi Scholarship Portal"
    />

    <meta
      property="og:image"
      content="https://vidhyanidhi.in/logo.png"
    />

    <meta
      property="og:image:alt"
      content="Vidya Nidhi Scholarship Portal"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Vidya Nidhi Scholarship Portal | Scholarships for Students in India"
    />

    <meta
      name="twitter:description"
      content="Find scholarships for students in India, check eligibility and apply online."
    />

    <meta
      name="twitter:image"
      content="https://vidhyanidhi.in/logo.png"
    />

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Vidya Nidhi Scholarship Portal",
        "url": "https://vidhyanidhi.in/",
        "logo": "https://vidhyanidhi.in/logo.png"
      }
    </script>

    <!-- Website Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Vidya Nidhi Scholarship Portal",
        "url": "https://vidhyanidhi.in/",
        "description": "Scholarship portal for students in India."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
