<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Vidya Nidhi Scholarship Portal | Scholarships for Students in India
    </title>

    <meta
      name="description"
      content="Vidya Nidhi Scholarship Portal helps students discover scholarship opportunities, eligibility details, application information and educational support in India."
    />

    <meta
      name="keywords"
      content="Vidya Nidhi Scholarship, scholarship portal India, scholarships for students, student scholarship, scholarship application, education scholarship"
    />

    <meta
      name="author"
      content="Vidya Nidhi Scholarship Portal"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://vidhyanidhi.in/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#0b1f3a"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:title"
      content="Vidya Nidhi Scholarship Portal | Scholarships for Students in India"
    />

    <meta
      property="og:description"
      content="Discover scholarship opportunities, eligibility details and educational support for students in India."
    />

    <meta
      property="og:url"
      content="https://vidhyanidhi.in/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="https://vidhyanidhi.in/logo.png"
    />

    <meta
      property="og:site_name"
      content="Vidya Nidhi Scholarship Portal"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Vidya Nidhi Scholarship Portal | Scholarships for Students in India"
    />

    <meta
      name="twitter:description"
      content="Discover scholarship opportunities and educational support for students in India."
    />

    <meta
      name="twitter:image"
      content="https://vidhyanidhi.in/logo.png"
    />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Vidya Nidhi Scholarship Portal",
        "url": "https://vidhyanidhi.in/",
        "logo": "https://vidhyanidhi.in/logo.png"
      }
    </script>

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Vidya Nidhi Scholarship Portal",
        "url": "https://vidhyanidhi.in/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
