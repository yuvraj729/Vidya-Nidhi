<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#0b1f3a" />

    <!-- SEO -->
<title>Vidya Nidhi Scholarship Portal | Scholarships for Students in India</title>

    <meta
  name="description"
  content="Find scholarships for school and college students in India. Check eligibility, award amounts, application deadlines and application details on Vidya Nidhi."
/>

    <meta
      name="author"
      content="Vidya Nidhi Scholarship Portal"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://vidhyanidhi.in/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/logo.png"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Vidya Nidhi Scholarship Portal | Scholarships for Students in India"
    />

    <meta
      property="og:description"
      content="Find scholarships for students in India. Check eligibility, scholarship amounts and application details, then apply online."
    />

    <meta
      property="og:url"
      content="https://vidhyanidhi.in/"
    />

    <meta
      property="og:site_name"
      content="Vidya Nidhi Scholarship Portal"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      property="og:image"
      content="https://vidhyanidhi.in/logo.png"
    />

    <meta
      property="og:image:alt"
      content="Vidya Nidhi Scholarship Portal"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Vidya Nidhi Scholarship Portal | Scholarships for Students in India"
    />

    <meta
      name="twitter:description"
      content="Find scholarships for students in India, check eligibility and apply online."
    />

    <meta
      name="twitter:image"
      content="https://vidhyanidhi.in/logo.png"
    />

    <!-- ========================= -->
    <!-- ORGANIZATION SCHEMA -->
    <!-- ========================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Vidya Nidhi Scholarship Portal",
        "url": "https://vidhyanidhi.in/",
        "logo": "https://vidhyanidhi.in/logo.png"
      }
    </script>

    <!-- ========================= -->
    <!-- WEBSITE SCHEMA -->
    <!-- ========================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Vidya Nidhi Scholarship Portal",
        "url": "https://vidhyanidhi.in/",
        "description": "Scholarship portal helping students in India discover scholarship opportunities, eligibility information and application details.",
        "inLanguage": "en-IN"
      }
    </script>

    <!-- ========================= -->
    <!-- WEBPAGE SCHEMA -->
    <!-- ========================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Vidya Nidhi Scholarship Portal",
        "url": "https://vidhyanidhi.in/",
        "description": "Find scholarships for students in India, check eligibility, scholarship amounts and application details.",
        "isPartOf": {
          "@type": "WebSite",
          "name": "Vidya Nidhi Scholarship Portal",
          "url": "https://vidhyanidhi.in/"
        },
        "about": {
          "@type": "Thing",
          "name": "Scholarships for students in India"
        },
        "inLanguage": "en-IN"
      }
    </script>

  </head>

  <body>
    <div id="root"></div>

    <!-- React Entry -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
